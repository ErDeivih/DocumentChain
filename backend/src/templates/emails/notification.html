<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{subject}}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #334155;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f8fafc;
        }
        .container {
            background: white;
            border-radius: 8px;
            padding: 24px;
            border: 1px solid #e2e8f0;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .logo {
            font-size: 28px;
            font-weight: 600;
            color: #0ea5e9;
            margin-bottom: 8px;
        }
        .button, .button:visited {
            color: #ffffff !important;
        }
        h1 {
            color: #0f172a;
            font-size: 22px;
            margin-bottom: 16px;
        }
        .message-box {
            background-color: #f8fafc;
            border-left: 3px solid #0ea5e9;
            padding: 16px;
            margin: 16px 0;
            border-radius: 4px;
        }
        .button {
            display: inline-block;
            background-color: #0ea5e9;
            color: white;
            padding: 12px 28px;
            text-decoration: none;
            border-radius: 6px;
            margin: 16px 0;
            font-weight: 500;
        }
        .button:hover {
            background-color: #0284c7;
        }
        .footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
            font-size: 12px;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">DocumentChain</div>
        </div>
        
        <h1>{{subject}}</h1>
        
        <p>Hola {{username}},</p>
        
        <div class="message-box">
            <p style="margin: 0;">{{message}}</p>
        </div>
        
        {{#if actionUrl}}
        <div style="text-align: center;">
            <a href="{{actionUrl}}" class="button" style="color: #ffffff !important;">{{actionText}}</a>
        </div>
        {{/if}}
        
        <div class="footer">
            <p>© {{year}} DocumentChain. Todos los derechos reservados.</p>
            <p>Este es un correo automático, por favor no respondas a este mensaje.</p>
        </div>
    </div>
</body>
</html>
