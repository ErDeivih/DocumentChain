name: deploy-local-server

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-local-server
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on:
      - self-hosted
      - linux
      - x64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify Docker runtime
        run: |
          docker version
          docker compose version

      - name: Deploy DocumentChain on local Ubuntu server
        env:
          SERVER_ENV_FILE: /opt/documentchain/.env.server
          ENABLE_IPFS_NODE: "1"
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          ADMIN_REGISTRATION_SECRET: ${{ secrets.ADMIN_REGISTRATION_SECRET }}
        run: bash scripts/deploy-ubuntu-server.sh