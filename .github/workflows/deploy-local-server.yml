name: deploy-local-server

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-local-server
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on:
      - self-hosted
      - linux
      - x64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify Docker runtime
        run: |
          docker version
          docker compose version

      - name: Deploy DocumentChain on local Ubuntu server
        env:
          SERVER_ENV_FILE: /opt/documentchain/.env.server
          ENABLE_IPFS_NODE: "1"
          RESET_DOCKER_STATE: "1"
          AUTO_RESEED_QA: "1"
          SEED_PROFILE: "qa-fast"
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BLOCKCHAIN_RPC_URL: ${{ vars.VITE_BLOCKCHAIN_RPC_URL }}
          BLOCKCHAIN_RPC_URL: ${{ vars.BLOCKCHAIN_RPC_URL }}
          CONTRACT_DOCUMENT_REGISTRY: ${{ vars.CONTRACT_DOCUMENT_REGISTRY }}
          IPFS_PROVIDER: ${{ vars.IPFS_PROVIDER }}
          IPFS_API_URL: ${{ vars.IPFS_API_URL }}
          IPFS_GATEWAY_URL: ${{ vars.IPFS_GATEWAY_URL }}
          IPFS_DATA_ROOT: ${{ vars.IPFS_DATA_ROOT }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_RELAYHOST: ${{ secrets.SMTP_RELAYHOST }}
          SMTP_RELAYHOST_USERNAME: ${{ secrets.SMTP_RELAYHOST_USERNAME }}
          SMTP_RELAYHOST_PASSWORD: ${{ secrets.SMTP_RELAYHOST_PASSWORD }}
          POSTFIX_SMTP_TLS_SECURITY_LEVEL: ${{ vars.POSTFIX_SMTP_TLS_SECURITY_LEVEL }}
          POSTFIX_HOSTNAME: ${{ vars.POSTFIX_HOSTNAME }}
          ALLOWED_SENDER_DOMAINS: ${{ vars.ALLOWED_SENDER_DOMAINS }}
          MASQUERADED_DOMAINS: ${{ vars.MASQUERADED_DOMAINS }}
          REQUIRE_SMTP_RELAY: ${{ vars.EMAIL_FROM != '' && secrets.SMTP_RELAYHOST != '' && secrets.SMTP_RELAYHOST_USERNAME != '' && secrets.SMTP_RELAYHOST_PASSWORD != '' && '1' || '0' }}
        run: bash scripts/deploy-ubuntu-server.sh