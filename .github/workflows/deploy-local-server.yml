name: deploy-local-server

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-local-server
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on:
      - self-hosted
      - linux
      - x64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify Docker runtime
        run: |
          docker version
          docker compose version

      - name: Deploy DocumentChain on local Ubuntu server
        env:
          SERVER_ENV_FILE: /opt/documentchain/.env.server
          ENABLE_IPFS_NODE: "1"
          RESET_DOCKER_STATE: "1"
          AUTO_RESEED_QA: "1"
          SEED_PROFILE: "qa-fast"
          EMAIL_FROM: "a791e9001@smtp-brevo.com"
          EMAIL_FROM_NAME: "DocumentChain"
          SMTP_HOST: "postfix"
          SMTP_PORT: "587"
          SMTP_SECURE: "false"
          SMTP_RELAYHOST: "[smtp-relay.brevo.com]:587"
          SMTP_RELAYHOST_USERNAME: "a791e9001@smtp-brevo.com"
          SMTP_RELAYHOST_PASSWORD: "xsmtpsib-809dabaa5a340f35db3767877202b9891fc2ba27009334b4e2bd877cb6611098-P93oF2P0v5sSyMuh"
          POSTFIX_SMTP_TLS_SECURITY_LEVEL: "encrypt"
          POSTFIX_HOSTNAME: "mail.documentchain.local"
          ALLOWED_SENDER_DOMAINS: "smtp-brevo.com"
          MASQUERADED_DOMAINS: "smtp-brevo.com"
          REQUIRE_SMTP_RELAY: "1"
        run: bash scripts/deploy-ubuntu-server.sh