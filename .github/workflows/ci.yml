name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run backend ESLint
        working-directory: backend
        run: npx eslint src/ --max-warnings 5

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend ESLint
        working-directory: frontend
        run: npx eslint src/ --ext .ts,.tsx

  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend Jest suite
        working-directory: backend
        run: npm test

  frontend-unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend Vitest suite
        working-directory: frontend
        run: npm test

  e2e-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            smart-contracts/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install smart-contract dependencies
        working-directory: smart-contracts
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Rebuild QA runtime with canonical reseed flow
        shell: pwsh
        run: ./scripts/reseed-dev.ps1 -SeedProfile qa-fast

      - name: Run Playwright Chromium suite
        working-directory: frontend
        env:
          CI: true
          E2E_API_BASE_URL: http://localhost:3000/api
          E2E_RPC_URL: http://127.0.0.1:8545
          E2E_DATABASE_URL: postgresql://documentchain:documentchain@localhost:5433/documentchain?schema=public
        run: npx playwright test --project=chromium --config playwright.e2e.local.config.ts

  smart-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: smart-contracts/package-lock.json
      - name: Install smart-contract dependencies
        working-directory: smart-contracts
        run: npm ci
      - name: Run Hardhat tests
        working-directory: smart-contracts
        run: npm test
